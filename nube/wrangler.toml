# Configuración del servidor de Qhatu en Cloudflare.
name = "qhatu-nube"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "qhatu"
# preparar-base.mjs lo completa al publicar (busca la base "qhatu" o la crea).
database_id = "00000000-0000-0000-0000-000000000000"

# Tope de pedidos por IP y por minuto, para que nadie cree miles de cuentas.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Salas en vivo para jugar con amigos: un Durable Object (con SQLite, disponible en el plan gratis) por sala.
[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[vars]
# ID de cliente web de Google (público) para "Vincular con Google". Vacío = apagado.
GOOGLE_CLIENT_ID = ""
# Pagos con cripto directo a tu billetera (vacío = apagado). Red: "polygon" o "base".
# La dirección es pública (0x…); nunca va aquí la frase secreta ni la llave privada.
CRIPTO_RED = "polygon"
CRIPTO_DIRECCION = "0x58C289698FA572F8448fC4e6f1B685B3B00226C8"
# Verificación de compras de Google Play: el JSON de la cuenta de servicio va como SECRETO
# (wrangler secret put GOOGLE_PLAY_CUENTA o en el panel de Cloudflare), nunca aquí.
