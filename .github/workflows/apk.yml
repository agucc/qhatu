name: APK Android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# Si llegan dos push seguidos, solo se publica el último.
concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Copiar el juego a la app
        run: npm run android:sync

      # Llave de firma fija: sin ella cada APK sale con una llave distinta y no se instala encima.
      - name: Llave de firma
        env:
          LLAVE: ${{ secrets.QHATU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LLAVE" ]; then
            echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/qhatu.jks"
            echo "QHATU_KEYSTORE=$RUNNER_TEMP/qhatu.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada."
          else
            echo "::warning::Falta el secreto QHATU_KEYSTORE_BASE64: la APK sale con una llave temporal y no se instala encima de la anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          QHATU_KEYSTORE_PASSWORD: ${{ secrets.QHATU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Huella de la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256" || true

      # La APK queda suelta en el release "apk-prueba", siempre con el mismo link:
      # https://github.com/<dueño>/<repo>/releases/download/apk-prueba/qhatu.apk
      - name: Publicar en el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qhatu.apk
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba qhatu.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Qhatu · APK de prueba" \
            --notes "Versión de prueba compilada desde la rama ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}).

          Para instalar: descarga qhatu.apk en el celular, ábrela y permite instalar apps de origen desconocido."
