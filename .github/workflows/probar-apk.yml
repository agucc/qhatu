name: Probar APK en emulador

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run android:sync

      # Llave de firma fija: sin ella cada APK sale con una llave distinta y no se instala encima.
      - name: Llave de firma
        env:
          LLAVE: ${{ secrets.QHATU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LLAVE" ]; then
            echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/qhatu.jks"
            echo "QHATU_KEYSTORE=$RUNNER_TEMP/qhatu.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada."
          else
            echo "::warning::Falta el secreto QHATU_KEYSTORE_BASE64: la APK sale con una llave temporal y no se instala encima de la anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          QHATU_KEYSTORE_PASSWORD: ${{ secrets.QHATU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir la app en el emulador
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/probar-apk.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-emulador
          path: captura.png
