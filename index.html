<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qhatu · Juega en el mercado</title>
  <meta name="description" content="Qhatu es un mercado boliviano de juegos casuales. Cada juego es un puesto y todo se paga con yapa.">
  <meta name="theme-color" content="#17131f">
  <script>
    // Si el juego no arranca en unos segundos, muestra qué falló (sirve para depurar en celulares).
    (function () {
      var errores = [];
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) errores.push('No cargó: ' + (t.src || t.href));
        else errores.push((e.message || 'Error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errores.push('Promesa: ' + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.QHATU_LISTO) return;
        var hojas = [];
        for (var i = 0; i < document.styleSheets.length; i++) {
          var s = document.styleSheets[i];
          var n;
          try { n = s.cssRules.length; } catch (x) { n = 'bloqueada'; }
          hojas.push((s.href || 'interna') + ' -> ' + n + ' reglas');
        }
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:70%;overflow:auto;margin:0;padding:12px;background:#fff;color:#000;font:12px monospace;white-space:pre-wrap;z-index:99999;border-radius:8px';
        d.textContent = 'Qhatu no pudo arrancar. Manda una captura de esto.\n\n' +
          location.href + '\n' + navigator.userAgent +
          '\n\nEstilos:\n' + (hojas.join('\n') || 'ninguno') +
          '\n\nErrores:\n' + (errores.join('\n') || 'ninguno') +
          '\n\nMódulos JS: ' + ('noModule' in document.createElement('script'));
        document.body.appendChild(d);
      }, 4000);
    })();
  </script>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="shared/qhatu.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="franja-aguayo"></div>
  <header class="cabecera">
    <a href="index.html" class="cabecera-logo" id="logo"></a>
    <div id="chip-yapa"></div>
  </header>

  <main class="portal">
    <section class="casera-tarjeta" aria-labelledby="saludo">
      <div class="casera-dibujo" id="casera"></div>
      <div class="casera-burbuja">
        <h1 id="saludo" data-t="saludo">¡Hola, caserito!</h1>
        <p id="regalo-texto"></p>
        <button class="boton" id="regalo-boton" data-t="regaloBoton">Recibir yapa</button>
        <div class="racha">
          <span class="racha-titulo" data-t="racha">Racha</span>
          <div class="racha-dias" id="racha-dias" aria-hidden="true"></div>
          <span class="racha-texto" id="racha-texto"></span>
        </div>
      </div>
    </section>

    <section aria-labelledby="titulo-puestos">
      <h2 class="seccion-titulo" id="titulo-puestos" data-t="puestos">Los puestos</h2>
      <div class="puestos" id="puestos"></div>
    </section>

    <a class="tienda-tarjeta" href="tienda/index.html">
      <div>
        <h2 data-t="tienda">La tienda</h2>
        <p data-t="tiendaDesc">Yapa, decoración y más para tu mercado.</p>
      </div>
      <span class="boton" data-t="entrar">Entrar</span>
    </a>
  </main>

  <footer class="pie">
    <p class="lema" data-t="lema">Juega en el mercado.</p>
    <div class="pie-acciones">
      <label class="idioma">
        <span data-t="idioma">Idioma</span>
        <select id="idioma"></select>
      </label>
      <button class="boton secundario" id="instalar" hidden data-t="instalar">Instalar en el celular</button>
    </div>
  </footer>
  <div class="franja-aguayo"></div>

  <script type="module" src="portal.js"></script>
</body>
</html>
