<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Refresquera · Qhatu</title>
  <meta name="description" content="Vierte refrescos hasta que cada vaso tenga un solo sabor y atiende a tus caseritos. Un puesto del mercado Qhatu.">
  <meta name="theme-color" content="#17131f">
  <script>
    // Si el juego no arranca en unos segundos, muestra qué falló (sirve para depurar en celulares).
    (function () {
      var errores = [];
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) errores.push('No cargó: ' + (t.src || t.href));
        else errores.push((e.message || 'Error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errores.push('Promesa: ' + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (window.QHATU_LISTO) return;
        var hojas = [];
        for (var i = 0; i < document.styleSheets.length; i++) {
          var s = document.styleSheets[i];
          var n;
          try { n = s.cssRules.length; } catch (x) { n = 'bloqueada'; }
          hojas.push((s.href || 'interna') + ' -> ' + n + ' reglas');
        }
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:70%;overflow:auto;margin:0;padding:12px;background:#fff;color:#000;font:12px monospace;white-space:pre-wrap;z-index:99999;border-radius:8px';
        d.textContent = 'Qhatu no pudo arrancar. Manda una captura de esto.\n\n' +
          location.href + '\n' + navigator.userAgent +
          '\n\nEstilos:\n' + (hojas.join('\n') || 'ninguno') +
          '\n\nErrores:\n' + (errores.join('\n') || 'ninguno') +
          '\n\nMódulos JS: ' + ('noModule' in document.createElement('script'));
        document.body.appendChild(d);
      }, 4000);
    })();
  </script>
  <link rel="icon" href="../icono.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../shared/qhatu.css">
  <link rel="stylesheet" href="refresquera.css">
</head>
<body class="refresquera">
  <div class="franja-aguayo"></div>
  <header class="barra">
    <a class="boton-icono" id="volver" href="../" data-t-aria="mercado" aria-label="Mercado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="barra-titulo">
      <span class="barra-puesto" data-t="refresquera">La Refresquera</span>
      <span class="barra-sub" id="subtitulo"></span>
    </div>
    <div id="chip-yapa"></div>
    <button class="boton-icono" id="sonido" type="button"></button>
  </header>

  <nav class="modos" aria-label="Modo">
    <button type="button" class="modo" data-modo="niveles" data-t="niveles">Niveles</button>
    <button type="button" class="modo" data-modo="pedidos" data-t="pedidos">Pedidos</button>
  </nav>

  <main class="mesa">
    <section class="pedidos-zona" id="pedidos-zona" hidden>
      <div class="pedidos-datos">
        <span><span data-t="atendidos">Atendidos</span> <strong id="atendidos">0</strong></span>
        <span><span data-t="record">Récord</span> <strong id="record">0</strong></span>
      </div>
      <ol class="fila" id="fila" aria-live="polite"></ol>
      <div class="llegada" aria-hidden="true">
        <span data-t="siguienteCaserito">Siguiente caserito</span>
        <div class="llegada-barra"><div id="llegada"></div></div>
      </div>
    </section>

    <section class="vasos" id="vasos" aria-label="Vasos"></section>
  </main>

  <footer class="acciones">
    <button type="button" class="accion" id="deshacer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span data-t="deshacer">Deshacer</span>
    </button>
    <button type="button" class="accion" id="pista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span data-t="pista">Pista</span>
    </button>
    <button type="button" class="accion" id="extra">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v15a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z"/><path d="M12 8v7M8.5 11.5h7"/></svg>
      <span data-t="vasoExtra">Vaso extra</span>
    </button>
    <button type="button" class="accion" id="reiniciar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
      <span data-t="reiniciar">Reiniciar</span>
    </button>
  </footer>

  <script type="module" src="juego.js"></script>
</body>
</html>
